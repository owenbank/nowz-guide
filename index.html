<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOWZ 사용가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <button class="navtoggle" id="navToggle" aria-label="메뉴" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="logo"><b>NOWZ</b><span>사용가이드</span></div>
  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="gsearch" placeholder="가이드 검색…" aria-label="검색" autocomplete="off">
    <div class="search-results" id="searchResults" hidden></div>
  </div>
</header>

<div class="layout">

  <!-- ===== LEFT NAV ===== -->
  <nav class="leftnav" id="leftnav">
    <div class="nav-group">
      <button class="nav-grouphead" aria-expanded="true" data-group="start">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        NOWZ 시작하기
      </button>
      <div class="nav-children" data-children="start">
        <a role="link" tabindex="0" data-target="signup">회원가입</a>
        <a role="link" tabindex="0" data-target="member">구성원 관리</a>
      </div>
    </div>
    <a role="link" tabindex="0" data-target="enroll">등록관리</a>
    <a role="link" tabindex="0" data-target="student">학생관리</a>
    <a role="link" tabindex="0" data-target="dashboard">대시보드</a>
    <a role="link" tabindex="0" data-target="message">메시지</a>
    <a role="link" tabindex="0" data-target="weekly">주간보고</a>
    <a role="link" tabindex="0" data-target="book">교재 관리</a>
    <a role="link" tabindex="0" data-target="program">프로그램 관리</a>
    <a role="link" tabindex="0" data-target="exam">시험지 관리</a>
    <a role="link" tabindex="0" data-target="test">테스트 관리</a>
    <a role="link" tabindex="0" data-target="score">성적 관리</a>
    <a role="link" tabindex="0" data-target="studyroom">공부방 관리</a>
    <a role="link" tabindex="0" data-target="cost">비용관리</a>
  </nav>

  <!-- ===== MAIN (섹션은 sections/*.js + assemble.js가 채운다) ===== -->
  <main class="main"></main>

  <!-- ===== RIGHT TOC ===== -->
  <aside class="righttoc" id="righttoc" aria-label="이 페이지 목차"></aside>

</div>
<div class="scrim" id="scrim"></div>

<!-- Lightbox -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
  <div class="lb-bar">
    <span class="lb-cap" id="lbCap"></span>
    <span class="lb-count" id="lbCount"></span>
    <button class="lb-btn" id="lbZoomOut" aria-label="축소"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    <button class="lb-btn" id="lbZoomIn" aria-label="확대"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    <button class="lb-btn" id="lbClose" aria-label="닫기"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-arrow prev" id="lbPrev" aria-label="이전"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img class="lb-img" id="lbImg" alt="">
    <button class="lb-arrow next" id="lbNext" aria-label="다음"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
</div>

<!-- 섹션 콘텐츠: 섹션마다 파일이 따로라 고칠 때 이 파일 전체를 열 필요가 없다 -->
<script src="sections/signup.js"></script>
<script src="sections/member.js"></script>
<script src="sections/enroll.js"></script>
<script src="sections/student.js"></script>
<script src="sections/dashboard.js"></script>
<script src="sections/message.js"></script>
<script src="sections/weekly.js"></script>
<script src="sections/book.js"></script>
<script src="sections/program.js"></script>
<script src="sections/exam.js"></script>
<script src="sections/test.js"></script>
<script src="sections/score.js"></script>
<script src="sections/studyroom.js"></script>
<script src="sections/cost.js"></script>
<script src="assemble.js"></script>
<script src="app.js"></script>
<script src="search.js"></script>
</body>
</html>
